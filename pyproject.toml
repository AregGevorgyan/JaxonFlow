[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jaxonflow"
version = "0.1.0"
description = "AI-agent-based backend for JAX and PyTorch that generates optimized GPU kernels using LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "JaxonFlow Contributors" }
]
keywords = [
    "jax",
    "pytorch",
    "gpu",
    "kernel",
    "llm",
    "triton",
    "cuda",
    "optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "torch>=2.10.0",
    "triton>=3.6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
gemini = ["google-genai>=1.0.0"]
# OpenRouter and Local use the openai SDK
openrouter = ["openai>=1.50.0"]
local = ["openai>=1.50.0"]
# All LLM providers
llm = ["jaxonflow[anthropic,openai,gemini]"]
jax = [
    "jax[cuda12]>=0.4.0",
]
pytorch = [
    "torch>=2.0.0",
    "triton>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "jaxonflow[llm,jax,pytorch,dev]",
]

[project.urls]
Homepage = "https://github.com/jaxonflow/jaxonflow"
Documentation = "https://jaxonflow.readthedocs.io"
Repository = "https://github.com/jaxonflow/jaxonflow"
Issues = "https://github.com/jaxonflow/jaxonflow/issues"

[tool.hatch.build.targets.wheel]
packages = ["jaxonflow"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
